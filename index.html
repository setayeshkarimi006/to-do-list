<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>to-do list</title>
  </head>
  <body>
    <div class="card">
      <div class="card-design">
        <h1 dir="rtl">برنامه ریزی کارها (to do list)</h1>
        <p dir="rtl" class="barnameh">
          برنامه‌ریز روزانه با تقویم شمسی / سریع و آفلاین
        </p>
        <div dir="rtl" class="date-section">
          <time id="current-date"></time>
        </div>
        <span class="lin"></span>
        <div class="todo-layout">
          <!-- ستون سمت راست: دسته‌بندی‌ها -->
          <aside class="column sidebar">
            <h2 class="section-title">اصلی‌ها</h2>

            <nav class="category-list">
              <button class="category-item active" data-category="day">
                <span class="category-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path
                      d="M12 2v2 M12 20v2 M4.93 4.93l1.42 1.42
            M17.65 17.65l1.42 1.42 M2 12h2 M20 12h2
            M4.93 19.07l1.42-1.42 M17.65 6.35l1.42-1.42"
                    ></path>
                  </svg>
                </span>
                <span>روز</span>
              </button>

              <button class="category-item" data-category="week">
                <span class="category-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                    <path d="M16 3v4 M8 3v4 M3 10h18"></path>
                  </svg>
                </span>
                <span>هفته</span>
              </button>

              <button class="category-item" data-category="month">
                <span class="category-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                    <path d="M16 3v4 M8 3v4 M3 10h18"></path>
                    <path
                      d="M8 14h.01 M12 14h.01 M16 14h.01
            M8 17h.01 M12 17h.01 M16 17h.01"
                    ></path>
                  </svg>
                </span>
                <span>ماه</span>
              </button>
            </nav>

            <div class="folder-heading">
              <h2 class="section-title">پوشه‌ها</h2>

              <button
                id="open-folder-modal"
                class="add-folder-btn"
                type="button"
                aria-label="افزودن پوشه"
              >
                +
              </button>
            </div>

            <div id="folder-list" class="folder-list">
              <!-- پوشه‌های JavaScript    -->
            </div>
          </aside>

          <!-- ستون سمت چپ: تسک‌ها -->
          <section class="column tasks-panel">
            <h2 class="section-title">تسک‌ها</h2>

            <form id="task-form" class="task-form">
              <input
                id="task-input"
                type="text"
                placeholder="تسک جدید..."
                autocomplete="off"
                required
              />

              <button class="send-btn" type="submit" aria-label="افزودن تسک">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M22 2 11 13"></path>
                  <path d="m22 2-7 20-4-9-9-4Z"></path>
                </svg>
              </button>
            </form>

            <div id="task-list" class="task-list">
              <!-- تسک‌ها  JavaScript    -->
            </div>
          </section>
          <div id="folder-modal" class="modal hidden">
            <div class="modal-content">
              <h3>ساخت پوشه جدید</h3>

              <form id="folder-form">
                <label for="folder-input">نام پوشه</label>

                <input
                  id="folder-input"
                  type="text"
                  maxlength="20"
                  placeholder="نام پوشه را وارد کنید"
                  required
                />

                <p class="character-count">حداکثر ۲۰ کاراکتر</p>

                <div class="modal-actions">
                  <button id="cancel-folder" type="button" class="cancel-btn">
                    انصراف
                  </button>

                  <button type="submit" class="confirm-btn">تأیید</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
